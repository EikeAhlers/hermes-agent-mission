<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Control</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%226%22 fill=%22%237dd3fc%22/%3E%3C/svg%3E">
</head>
<body>
<canvas id="sky"></canvas>

<header id="hud">
  <div class="brand">
    <span class="mark"></span>
    <div>
      <h1>Mission Control</h1>
      <p id="profile">hermes</p>
    </div>
  </div>
  <div class="metrics">
    <div class="metric"><span class="k">running</span><span class="v" id="m-running">0</span></div>
    <div class="metric"><span class="k">sessions 24h</span><span class="v" id="m-sessions">0</span></div>
    <div class="metric"><span class="k">tokens 24h</span><span class="v" id="m-tokens">0</span></div>
    <div class="metric"><span class="k">cost 24h</span><span class="v" id="m-cost">$0</span></div>
    <div class="metric"><span class="k">tools 24h</span><span class="v" id="m-tools">0</span></div>
  </div>
  <div class="live" id="live"><span class="dot"></span><span id="live-label">connecting</span></div>
</header>

<div id="search-wrap">
  <input id="search" type="search" placeholder="Search every message…  ( / )" autocomplete="off" spellcheck="false">
  <div id="hits"></div>
</div>

<aside id="drawer">
  <button id="close" aria-label="close">×</button>
  <div id="drawer-body"><p class="hint">Click a star to inspect a session.</p></div>
</aside>

<footer id="dock">
  <canvas id="timeline" height="64"></canvas>
  <div class="legend" id="legend"></div>
  <div class="rate"><span id="rate">0</span> tok/min</div>
</footer>

<script src="app.js"></script>
</body>
</html>
